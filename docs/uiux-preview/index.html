<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ImperiaSmart • Bản mẫu UI/UX</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header class="review-bar">
    <div class="review-label"><span class="review-dot"></span><strong>BẢN MẪU UI/UX</strong><span>Dữ liệu minh họa · chưa kết nối hệ thống</span><a href="login-v2.html">Mẫu đăng nhập mới ↗</a></div>
    <nav aria-label="Chọn màn hình mẫu" class="view-switch">
      <button data-view="driver" aria-pressed="true">01 · Tìm chỗ đỗ</button>
      <button data-view="operator" aria-pressed="false">02 · Điều hành</button>
      <button data-view="login" aria-pressed="false">03 · Đăng nhập</button>
    </nav>
  </header>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="action-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <div class="eyebrow">THAO TÁC MINH HỌA</div>
    <h2 id="confirm-title">Xác nhận thao tác</h2>
    <p id="confirm-description"></p>
    <div class="confirm-actions"><button class="button" data-action="dismiss" autofocus>Quay lại</button><button class="button primary" data-action="approve">Xác nhận thử</button></div>
  </dialog>
  <footer class="review-footer">Hướng thiết kế: rõ thao tác, thoáng nội dung, minh họa vừa đủ. Sơ đồ và số liệu trong mẫu là giả lập.</footer>
</body>
</html>
